[project]
name = "pyskraper"
version = "1.0.0"
description = "Scrape ScreenScraper.fr metadata and media onto a KNULLI/Batocera SD card"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Gnzlt" }]
keywords = ["screenscraper", "retrogaming", "emulationstation", "batocera", "knulli", "scraper", "gamelist"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/Gnzlt/pySkraper"
Repository = "https://github.com/Gnzlt/pySkraper"
Issues = "https://github.com/Gnzlt/pySkraper/issues"

[project.optional-dependencies]
images = ["pillow>=10.3"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
pyskraper = "pyskraper.cli:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyskraper*"]

[tool.setuptools.package-data]
pyskraper = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["A005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits the live ScreenScraper API and spends quota (deselected by default)",
]
addopts = "-m 'not integration'"
filterwarnings = [
    # getpass cannot control terminal echo under pytest's piped stdin. The
    # wizard tests drive it deliberately; the warning says nothing useful.
    "ignore::getpass.GetPassWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^\\.venv/"]

# Pillow is an optional extra, so its stubs may legitimately be absent.
[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true
